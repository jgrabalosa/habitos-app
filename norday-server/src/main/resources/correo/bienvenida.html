<!DOCTYPE html>
<html lang="{{idioma}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{asunto}}</title>
</head>
<body style="margin:0;padding:0;background:#eef2f6">
<!-- Texto de vista previa: oculto; lo enseña el buzón junto al asunto. -->
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all">{{vistaPrevia}}</div>
<div role="article" aria-roledescription="email" lang="{{idioma}}">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f6">
  <tr><td align="center" style="padding:24px 12px 32px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px">
      <tr><td style="padding:0 8px 16px;font-family:'Space Grotesk',Manrope,Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:.2px;color:#23395d">Norday Habits</td></tr>
    </table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:24px">
      <tr><td align="center" style="padding:32px 24px 0">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td align="center" style="width:136px;height:136px;border-radius:68px;background:#e3f6eb">
          <img src="cid:nori" width="72" alt="{{altNori}}" style="display:block;width:72px;height:auto;margin:0 auto">
        </td></tr></table>
      </td></tr>
      <tr><td style="padding:24px 24px 8px"><h1 style="margin:0;font-family:'Space Grotesk',Manrope,Arial,Helvetica,sans-serif;font-size:28px;line-height:32px;font-weight:700;color:#0a1628">{{titular}}</h1></td></tr>
      <tr><td style="padding:12px 24px 8px"><p style="margin:0 0 16px;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:17px;line-height:28px;color:#23395d">{{parrafo1}}</p><p style="margin:0 0 16px;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:17px;line-height:28px;color:#23395d">{{parrafo2}}</p><p style="margin:0 0 16px;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:17px;line-height:28px;color:#23395d">{{parrafo3}}</p></td></tr>
      <tr><td align="center" style="padding:8px 24px 32px">
        <a href="{{enlacePlay}}" style="display:inline-block;background:#27c76f;color:#0a1628;font-family:Manrope,Arial,Helvetica,sans-serif;font-weight:800;font-size:17px;line-height:24px;text-decoration:none;padding:16px 28px;border-radius:999px;white-space:nowrap">{{boton}}</a>
      </td></tr>
      <tr><td style="padding:0 24px 32px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-top:1px solid #e3e9f0;padding-top:16px;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:17px;color:#0a1628">{{firma}}</td></tr></table>
      </td></tr>
    </table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px">
      <tr><td align="center" style="padding:24px 16px 8px;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#23395d">{{redes}}</td></tr>
      <tr><td align="center" style="padding:0 8px 16px"><a href="{{enlaceInstagram}}" style="display:inline-block;margin:4px;padding:8px 16px 8px 10px;border:1px solid #c9d3df;border-radius:999px;background:#ffffff;color:#0a1628;font-family:Manrope,Arial,Helvetica,sans-serif;font-weight:700;font-size:15px;line-height:30px;text-decoration:none;white-space:nowrap"><img src="cid:instagram" width="30" height="30" alt="" style="display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:10px;border:0"><span style="vertical-align:middle">Instagram</span></a><a href="{{enlaceTikTok}}" style="display:inline-block;margin:4px;padding:8px 16px 8px 10px;border:1px solid #c9d3df;border-radius:999px;background:#ffffff;color:#0a1628;font-family:Manrope,Arial,Helvetica,sans-serif;font-weight:700;font-size:15px;line-height:30px;text-decoration:none;white-space:nowrap"><img src="cid:tiktok" width="30" height="30" alt="" style="display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:10px;border:0"><span style="vertical-align:middle">TikTok</span></a></td></tr>
      <tr><td align="center" style="padding:8px 24px 0;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#4b5b70">{{pie}}</td></tr>
    </table>
  </td></tr>
</table>
</div>
</body>
</html>
