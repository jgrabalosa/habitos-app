# Propiedades que valen en TODAS las máquinas y entornos. Spring carga este
# fichero cuando no hay perfil activo, que es el caso normal: el arranque
# dice "No active profile set, falling back to 1 default profile: default".
#
# Existe porque application.properties está en .gitignore y no hay ningún
# otro sitio versionado donde poner una propiedad que deba aplicar en todas
# partes.
#
# CUIDADO: a este fichero NO lo tapa src/test/resources, porque ese solo
# tiene un application.properties y aquí el nombre lleva sufijo de perfil.
# Además las propiedades de perfil ganan a las que no lo son. Es decir: lo
# que se ponga aquí se aplica también a los tests y POR ENCIMA de su
# configuración. No poner nunca aquí datasource, credenciales ni nada que
# dependa del entorno, o se rompe el aislamiento de la BD de test.

# Explícito para documentar la decisión y callar el aviso del arranque.
# true es el valor que ya estaba en vigor por defecto: esto no cambia nada.
# Hoy hay relaciones LAZY que se serializan a JSON (Registro.habito) y
# dependen de que esto siga activo. Ponerlo a false las rompe.
spring.jpa.open-in-view=true
