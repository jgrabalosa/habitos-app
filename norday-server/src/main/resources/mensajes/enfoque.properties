# Textos de Norday Focus (módulo enfoque). Base en español: es la caída.
# Los que llevan {n} pasan por MessageFormat: sin apóstrofos sueltos.
enfoque.peticion.clave=La clave de la sesión no es válida.
enfoque.peticion.inicio=La hora de inicio de la sesión no es válida.
enfoque.peticion.estado=El estado de la sesión no es válido.
enfoque.peticion.objetivo=La duración elegida debe estar entre {0} y {1} minutos, de {2} en {2}.
enfoque.peticion.duracion=La duración de la sesión no es válida.
enfoque.peticion.duracion.maxima=Una sesión no puede durar más de {0} minutos.
enfoque.peticion.duracion.minima=Una sesión que cuenta dura al menos {0} minutos.
enfoque.peticion.destino=El destino de la sesión no es válido.
enfoque.peticion.futura=La sesión termina en el futuro: revisa la hora del móvil.
enfoque.peticion.antigua=La sesión empezó hace más de {0} días y ya no se puede guardar.
enfoque.sesion.solape=Esta sesión se solapa con otra que ya está guardada.
enfoque.sesion.clave.otra=Ya hay una sesión distinta guardada con esa clave.
enfoque.resumen.fechas=Las fechas del resumen no son válidas: se espera AAAA-MM-DD.
enfoque.resumen.rango=El resumen abarca como mucho {0} días, con la fecha final igual o posterior a la inicial.
enfoque.historial.pagina=La página del historial no es válida: tamaño de 1 a {0}.
enfoque.aporte.sesion.perdida=Una sesión perdida no suma minutos.
enfoque.aporte.destino.desconocido=Ese destino no se reconoce.
