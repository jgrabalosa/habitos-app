# Avisos de la app (AvisosAppScheduler): la vuelta y el momento débil. Reglas de
# redacción: lo hecho al principio y lo que falta al final; el fallo no se
# nombra; se dice la causa; se invita, no se ordena. Numeradas desde 1: cuántas
# hay de cada una está en CalculoAvisos.VARIANTES y BundlesMensajesTest lo vigila.
# Las de vuelta se leen sin argumentos (apóstrofo simple); las del momento débil,
# siempre con argumentos (el apóstrofo se dobla: '').
