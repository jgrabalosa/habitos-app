# Configuración exclusiva de los tests con @SpringBootTest de este módulo.
# Existe para que no hereden application.properties de src/main, que en cada
# máquina apunta a la base de datos real: en el VPS, a producción.

spring.datasource.url=jdbc:postgresql://localhost:5432/habitos_db_test
spring.datasource.username=${TEST_DB_USER:norday_test}
spring.datasource.password=${TEST_DB_PASSWORD:norday_test}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo genera Hibernate desde las entidades y se destruye al terminar.
# Flyway no puede construir esta BD: no existe una migración V1, el histórico
# está baselined sobre un esquema creado con ddl-auto=update.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# El contexto exige estas tres al arrancar y no tienen valor por defecto.
jwt.secret=clave-solo-para-tests-sin-valor-fuera-de-aqui
jwt.expiration=2592000000
norday.mail.from=tests@norday.local
